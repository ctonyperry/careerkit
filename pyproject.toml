[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "careerkit"
version = "0.1.0"
description = "A resume you can be cross-examined on. Evidence corpus, deterministic gates, LLM drafting in Claude Code."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2",
  "pyyaml>=6",
]

[project.optional-dependencies]
gates = ["python-docx>=1.1"]
mcp = ["mcp>=2"]
dev = ["pytest>=8", "ruff>=0.5", "python-docx>=1.1", "mcp>=2"]

[project.scripts]
careerkit = "careerkit.cli:main"

[tool.setuptools]
packages = ["careerkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Gates carry long regexes and an HTML template; wrapping them hides the pattern.
"tools/*" = ["E501"]

[tool.mypy]
strict = true
