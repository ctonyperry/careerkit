    caught_by: author
    enforced_by: skill:avoid-ai-writing

  - id: approval-framed-boast
    form: prose
    date: 2026-08-25
    shipped: false
    text: "The six-month contract was extended to nine to roll it out to further sites."
    problem: >-
      The grammatical subject is their decision about him rather than the work.
      Re-subjecting onto the software fixes it without losing the fact.
    caught_by: author
    enforced_by: human
    note: >-
      Deliberately not mechanised: "brought in to break a renewal-blocking
      problem" is also approval-framed and reads well, because there the
      approval sets up a challenge instead of being the payoff.

  - id: doubted-metric-printed
    date: 2026-08-25
    shipped: true
    text: "a $10M rollout to ~2M franchise front-line workers"
    problem: >-
      the author stopped standing behind the figure ("I think 3 might have been the
      real number") while it was live in Drive. Confirmation moved the corpus;
      doubt did not.
    caught_by: author
    enforced_by: lint:do-not-print
    expect_block: true
    # The rule reads do_not_print off the corpus, so the fixture carries the
    # phrase the original unit protected and regress injects it. Without this
    # the entry could only be replayed against the one corpus it came from.
    context:
      do_not_print: ["$10M"]

  - id: withheld-artifact-offered
    date: 2026-08-25
    shipped: false
    text: "**UX Telemetry Kit** (open source, npm): a React module publishing analytics events"
    problem: >-
      An artifact the author is not ready to share was written onto a resume, and the
      selector kept offering the unit to the writer afterwards.
    caught_by: author
    enforced_by: lint:do-not-print
    expect_block: true
    context:
      do_not_print: ["UX Telemetry Kit"]

  - id: unsupported-skills-keyword
    date: 2026-08-25
    shipped: false
    text: "JavaScript front-end work"
    problem: >-
      Listed in Technical Skills while no bullet demonstrated it, and the gap
      report scored `javascript` MISS. A JD-required keyword was being carried
      by the keyword line alone.
    caught_by: metrics  # the hand-run audit that became tools/metrics.py
    enforced_by: metrics:skills_terms_unsupported

  - id: foreign-domain-jargon
    date: 2026-08-25
