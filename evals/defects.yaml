# Defect corpus: every quality failure this project has actually shipped or
# nearly shipped, with provenance and current enforcement.
#
# The point is one question nobody could answer before this file existed:
# WOULD THE CURRENT PIPELINE CATCH YESTERDAY'S MISTAKES?
#
# `caught_by` is what found it the first time. `enforced_by` is what would find
# it now. When enforced_by is `human`, that is an honest admission, not a gap to
# paper over: some of these resist mechanisation and the reason is recorded.
#
# Run: python tools/regress.py

defects:
  - id: fabricated-tenure-aggregate
    form: prose
    date: 2026-08-24
    shipped: true
    text: "into fifteen years of customer-facing integration consulting at enterprise scale"
    problem: >-
      A summary aggregate computable from nothing. The spine gives six years of
      customer-facing consulting; reaching fifteen required counting a platform
      ownership role and a contract whose own render note says NOT customer-facing.
    caught_by: adversarial-eval
    enforced_by: lint:tenure-not-computed
    expect_block: true

  - id: tenure-aggregate-published
    form: prose
    date: 2026-08-24
    shipped: true
    text: "with 15+ years customer-facing across technical pre-sales and post-sales delivery"
    problem: >-
      The same defect in the digit form, live in Google Drive for several hours.
      Aggregates feel like arithmetic rather than claims, so they bypass the
      instinct to check a source.
    caught_by: author
    enforced_by: lint:tenure-not-computed
    expect_block: true

  - id: decade-error
    form: prose
    date: 2026-08-24
    shipped: false
    text: "from running colo firewalls and load balancing in the 2000s"
    problem: >-
      The colo work is AthenaOnline, 2011-2018. Off by a decade, and trivially
      falsifiable by reading the resume next to the letter.
    caught_by: adversarial-eval
    enforced_by: human
    note: >-
      crosscheck catches a role rendered with the wrong TENSE, not a claim placed
      in the wrong decade in prose. Detecting that needs the claim tied to a
      role, which prose does not do.

  - id: house-rule-slop-quoted
    form: prose
    date: 2026-08-24
    shipped: false
    text: "I was the one in the room with the customer, their implementation partner, and our engineering team until it worked."
    problem: >-
      Almost verbatim the example CLAUDE.md names as semantic slop ("staying in
      the room when it breaks"). Also over-framed: the evidence says he brought
      the root cause to engineering, collaboratively.
    caught_by: adversarial-eval
    enforced_by: skill:avoid-ai-writing
    note: Atmosphere-pose detection is semantic; the CP3.5 pass is the gate.

  - id: self-rating-tricolon
    form: prose
    date: 2026-08-24
    shipped: false
    text: "I know the protocols, the failure modes, and what it feels like to be the customer in those meetings."
    problem: >-
      Self-rating plus atmosphere plus a rhetorical tricolon, and factually
      inverted: he was the vendor-side consultant, never the customer.
    caught_by: adversarial-eval
    enforced_by: lint:tricolon
    expect_block: false  # tricolon is advisory by design

  - id: defensive-education-framing
    form: prose
    date: 2026-08-24
    shipped: false
    text: "The degree. I don't have a bachelor's. I'll put that up against the 'or equivalent' clause and let the interviews decide."
    problem: >-
      The compensatory framing the house rules ban outright: leads with the
      absence, then argues against the requirement.
    caught_by: adversarial-eval
    enforced_by: human
    note: >-
      "no degree but" is bannable as a phrase; a whole paragraph performing the
      same move is not a string match. STYLE-GUIDE section 3 carries the rule.

  - id: invented-motive
    form: prose
    date: 2026-08-24
    shipped: false
    text: "That was deliberate. I wanted serious hands-on time with AI-assisted development inside a security organization before picking where to land long term."
    problem: >-
      A career narrative no unit records, which also quietly overwrote the exit
      framing the spine does record.
    caught_by: adversarial-eval
    enforced_by: human
    note: Motive is unfalsifiable from a corpus; only a reader who knows the spine catches it.

  - id: cross-jd-contamination
